# Milestone 3 parameters. Lists of numbers MUST be written with decimals (1.0, not 1).
height_map_3d:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /lidar_3d/points
    map_frame: map
    voxel_size: 0.10
    min_range: 0.6        # ignore hits on the drone itself
    max_range: 7.0        # small tilt errors grow with range; victims are seen within 6 m
    z_min: -0.2
    z_max: 3.2
    color_z_min: 0.0      # blue at the floor
    color_z_max: 3.0      # red at the top of the 3 m walls
    min_hits: 2
    process_every_n: 4    # 2.5 Hz: run 3 at 5 Hz starved Nav2 of CPU (controller missed its rate)
    publish_period: 2.0
    publish_min_z: 0.1    # floor left out of /map_3d (it is still in the saved .ply)
    # GPS off: rf2o's TF is flat (z = 0, no tilt). Take height + roll/pitch from PX4 and
    # snap every scan so the floor is at z = 0. Without this the map is drawn 1.5 m too low.
    level_with_px4: true
    px4_odom_topic: /fmu/out/vehicle_odometry
    base_frame: base_link
    floor_snap: true

victim_detector:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    period: 2.0
    match_radius: 0.7
    min_hits: 4                   # seen in 4 map updates in a row before a pin appears
    # True victim positions from building_victims.sdf (map frame = Gazebo world at spawn).
    # Only used to print the error for the report; the detector never looks at them.
    ground_truth_xy: [-8.0, -6.5, 3.0, -4.5, -3.0, 6.6, 8.6, 5.5]
    cell: 0.1
    floor_cut: 0.12               # victims' tops are >= 0.22 m; floor noise stays below this
    z_consider_max: 2.6
    max_object_height: 1.3        # taller columns = walls, pillars, shelf
    min_cells: 6
    lying_h: [0.15, 0.5]
    lying_len: [1.0, 2.2]
    lying_wid: [0.3, 0.9]          # 2-cell-wide floor streaks are 0.2
    sitting_h: [0.6, 1.2]
    sitting_len: [0.35, 1.25]
    sitting_wid: [0.2, 0.9]
    top_band: 0.12
    max_top_fraction: 0.45        # crates/tables are flat on top (~1.0), people are not
    min_fill: 0.35                # thin floor streaks fill ~10% of their box, people > 50%
    wall_margin: 0.5              # smeared wall copies sit within 0.3 m of the wall; victims are >= 0.8 m away
