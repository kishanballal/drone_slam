# Milestone 3 parameters. Lists of numbers MUST be written with decimals (1.0, not 1).
height_map_3d:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /lidar_3d/points
    map_frame: map
    voxel_size: 0.10
    min_range: 0.6        # ignore hits on the drone itself
    max_range: 10.0
    z_min: -0.2
    z_max: 3.2
    color_z_min: 0.0      # blue at the floor
    color_z_max: 3.0      # red at the top of the 3 m walls
    min_hits: 2
    process_every_n: 2
    publish_period: 1.0

victim_detector:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    period: 1.0
    match_radius: 0.7
    min_hits: 3                   # seen in 3 map updates in a row before a pin appears
    # True victim positions from building_victims.sdf (map frame = Gazebo world at spawn).
    # Only used to print the error for the report; the detector never looks at them.
    ground_truth_xy: [-8.0, -6.5, 3.0, -4.5, -3.0, 7.2, 8.6, 5.5]
    cell: 0.1
    floor_cut: 0.08
    z_consider_max: 2.6
    max_object_height: 1.3        # taller columns = walls, pillars, shelf
    min_cells: 6
    lying_h: [0.15, 0.5]
    lying_len: [1.0, 2.2]
    lying_wid: [0.2, 0.9]
    sitting_h: [0.6, 1.2]
    sitting_len: [0.35, 1.1]
    sitting_wid: [0.2, 0.9]
    top_band: 0.12
    max_top_fraction: 0.45        # crates/tables are flat on top (~1.0), people are not
