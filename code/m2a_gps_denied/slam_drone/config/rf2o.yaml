# rf2o laser odometry, Milestone 2a.
# rf2o owns the odom -> base_link TF in M2a (the M1 odom_tf node must be off).
/**:   # any node name (rf2o names itself CLaserOdometry2DNode under ros2 run)
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom          # same topic M1 used, so Nav2 (M2b) doesn't change
    publish_tf: true
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""   # empty = start at (0,0,0) right away
    freq: 20.0
    use_sim_time: true
