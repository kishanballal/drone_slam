# Fallback frontier explorer (plan B, no Nav2)
frontier_explorer:
  ros__parameters:
    use_sim_time: true
    map_topic: /map
    map_frame: map
    base_frame: base_link
    inflate_radius: 0.45      # robot radius 0.40 + margin; doorways are only 1.2 m wide
    min_frontier_size: 0.5
    lookahead: 1.2
    goal_reached_dist: 0.4
    keep_goal_radius: 0.6
    goal_timeout: 40.0
    blacklist_radius: 0.8
    replan_period: 1.0
    return_home: true
